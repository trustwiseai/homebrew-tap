name: Test Brew Install

on:
  push:
    branches: [main]
    paths: ['Casks/**']

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Install from Homebrew
        run: |
          brew tap trustwiseai/tap
          # Homebrew 6.0.0+ requires explicit trust for non-official taps.
          brew trust trustwiseai/tap
          brew install --cask trustwise-cli
          trustwise --version
          echo "Rolling install test passed"

      - name: Install pinned series cask
        run: |
          # Newest pinned cask in the tap, e.g. trustwise-cli@4.7
          TAP_DIR="$(brew --repository trustwiseai/tap)"
          PINNED=$(basename "$(ls "$TAP_DIR"/Casks/trustwise-cli@*.rb | sort -V | tail -1)" .rb)
          echo "Testing pinned cask: ${PINNED}"

          # Pinned casks conflict_with the rolling one by design.
          brew uninstall --cask trustwise-cli
          brew install --cask "$PINNED"
          trustwise --version
          echo "Pinned install test passed"
